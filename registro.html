<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo.png">
    <title>Registro de Alumnos - Oficina Técnica</title>
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

    <header class="tech-header">
        <div class="tech-logo">
            <img src="img/logo.png" alt="Logo Oficina Técnica">
            <div class="logo-info">
                <h2>OFICINA TÉCNICA</h2>
                <span>Ingeniería & Proyectos</span>
            </div>
        </div>

        <nav class="tech-nav">
            <a href="index.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="login.html">Inicio sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>
    </header>

    <main>
        <section class="registro-container">
            <h1>Registro de Alumno</h1>
            <p class="subtitulo">Completa tus datos para habilitar el desbloqueo y solicitud de netbooks.</p>

            <form id="formulario">
                <label for="dni">DNI</label>
                <input type="number" id="dni" name="dni" placeholder="Ej: 45123456" required>

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido" required>

                <label for="curso">Curso</label>
                <input type="text" id="curso" name="curso" placeholder="Ej: 5to A" required>

                <label for="año">Año</label>
                <input type="number" id="año" name="año" placeholder="Ej: 5" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

                <button type="submit">Enviar Registro</button>
            </form>

            <div id="conte"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 Oficina Técnica - Sistema de Desbloqueo y Solicitud de Netbooks</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
